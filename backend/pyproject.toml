[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "lxml==6.1.1",
    "openai==3.0.0",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-ai==2.28.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.52",
    "structlog==26.1.0",
    "supabase==2.31.0",
    "tiktoken==0.13.0",
    "uvicorn==0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Installs `app/` as an editable package so `from app...` resolves from uvicorn,
# pytest, notebooks, and IDE run buttons — not just from the backend/ cwd.
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need live Supabase and OpenAI credentials. The fast suite is
# `pytest -m "not integration"` and must touch neither.
markers = ["integration: requires live Supabase and/or OpenAI credentials"]
# Async tests need no per-test decorator.
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.2",
]
